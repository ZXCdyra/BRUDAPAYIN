services:
  - type: web
    name: brudapay-web
    env: node
    region: oregon
    plan: standard
    buildCommand: npm install --legacy-peer-deps && npm run build:config && npm run build --workspace=@p2p/shared && npx prisma generate --schema=packages/prisma/prisma/schema.prisma && cd apps/api && npx nest build && cd ../web && npm run build:web
    startCommand: ./start.sh
    healthCheckPath: /
    disk:
      name: p2p-data
      mountPath: /tmp
      sizeGB: 10
    buildTimeoutInSeconds: 1800
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_RUNTIME
        value: nodejs
      - key: API_ORIGIN
        value: "http://localhost:3001"
      - key: DATABASE_URL
        sync: false
        description: "Neon PostgreSQL connection string"
      - key: JWT_SECRET
        sync: false
        description: "JWT secret for authentication"
